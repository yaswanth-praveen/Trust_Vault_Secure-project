version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustvault_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trustvault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustvault} -d ${POSTGRES_DB:-trustvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trustvault}:${POSTGRES_PASSWORD:-trustvault_secret}@postgres:5432/${POSTGRES_DB:-trustvault}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_secret_in_production_min_32_chars}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: "false"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/vault_storage
    ports:
      - "5000:5000"
    volumes:
      - vault_storage:/app/vault_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustvault-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  vault_storage:
